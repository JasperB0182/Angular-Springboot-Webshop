name: Auto-docker deploy

on:
  push:
    branches: ["master"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build backend with Maven
        working-directory: backend
        run: mvn clean package -DskipTests

      - name: Log in to Docker Hub
        run: docker login -u s1155772 -p ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build backend image
        run: docker build -t s1155772/webshop-backend:latest backend

      - name: Push backend image
        run: docker push s1155772/webshop-backend:latest

      - name: Build frontend image
        run: docker build -t s1155772/webshop-frontend:latest frontend

      - name: Push frontend image
        run: docker push s1155772/webshop-frontend:latest


  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/webshop
            docker compose pull
            docker compose up -d
